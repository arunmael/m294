<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <title>Reminder</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>

<body>
    <header>
        <h1>Reminder</h1>
        <button id="new" class="nav">+</button>
        <button id="back" class="nav">
            < </button>
    </header>
    <main>
        <section id="aufgaben">
            <h2>Aufgaben:</h2>
            <!--<button id="reload">Reload</button>-->
            <div id="aufgaben-liste"></div>
        </section>

        <section id="aufgabe-erstellen">
            <h2 id="aufgabe-title"></h2>
            <form id="form">
                <label for="input-title">Titel</label>
                <input type="text" id="input-title" name="title">
                <label for="completed-button">Abgeschlossen:</label>
                <input type="checkbox" id="completed-button" name="completed">
                <button type="submit" id="submit">Speichern</button>
                <button type="submit" id="submit-update">Update</button>
            </form>
        </section>
        <section id="login">
            <form id="login-form">
                <label for="user-name">Benutzername:</label>
                <input type="email" id="username" name="title">
                <label for="password">Passwort</label>
                <input type="password" id="password" name="password">
                <button type="submit" id="login-button">Login</button>
            </form>
        </section>
    </main>
</body>

</html>
