<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<main>
    <h1>My best Friends</h1>
    <div>
        <h2>Add new Friend</h2>
        <form>
            <label for="fname">Vorname</label>
            <input type="text" name="fname" id="fname" required>
            <label for="lname">Nachname</label>
            <input type="text" name="lname" id="lname" required>
            <label for="street">Strasse</label>
            <input type="text" name="street" id="street" required>
            <label for="plz">PLZ</label>
            <input type="text" name="plz" id="plz" required>
            <label for="ort">Ort</label>
            <input type="text" name="ort" id="ort" required>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required>
            <label for="duzi">Duzi</label>
            <input type="checkbox" name="duzi" id="duzi">
            <label for="verbindung">Von wo bekannt?</label>
            <select name="verbindung" id="verbindung" required>
                <option value="privat">Privat</option>
                <option value="schule">Schule</option>
                <option value="arbeit">Arbeit</option>
            </select>
            <button type="submit" id="submit">Submit</button>
            <button type="reset" id="reset">Reset</button>
        </form>
    </div>
</main>

</html>
